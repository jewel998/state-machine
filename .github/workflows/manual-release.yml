name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string

jobs:
  manual-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run validation
        run: pnpm run validate
      
      - name: Build package
        run: pnpm run build
      
      - name: Bump version
        run: |
          npm version ${{ github.event.inputs.version_type }} --no-git-tag-version
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      
      - name: Update CHANGELOG
        run: |
          echo "## [$NEW_VERSION] - $(date +%Y-%m-%d)" > temp_changelog.md
          echo "" >> temp_changelog.md
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            echo "${{ github.event.inputs.release_notes }}" >> temp_changelog.md
          else
            echo "### Added" >> temp_changelog.md
            echo "- Manual release for version $NEW_VERSION" >> temp_changelog.md
          fi
          echo "" >> temp_changelog.md
          cat CHANGELOG.md >> temp_changelog.md
          mv temp_changelog.md CHANGELOG.md
      
      - name: Commit version bump
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore: manual release v$NEW_VERSION"
          git tag "v$NEW_VERSION"
      
      - name: Push changes
        run: |
          git push origin main
          git push origin "v$NEW_VERSION"
      
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.NEW_VERSION }}
          release_name: Release v${{ env.NEW_VERSION }}
          body: |
            ## Changes in v${{ env.NEW_VERSION }}
            
            ${{ github.event.inputs.release_notes || 'Manual release with latest changes.' }}
            
            ### Installation
            ```bash
            npm install @jewel998/state-machine@${{ env.NEW_VERSION }}
            ```
            
            See [CHANGELOG.md](https://github.com/jewel998/state-machine/blob/main/CHANGELOG.md) for detailed changes.
          draft: false
          prerelease: false