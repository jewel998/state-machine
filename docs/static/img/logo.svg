<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e8555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#25c2a0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#gradient)" opacity="0.1"/>

  <!-- State nodes -->
  <circle cx="60" cy="80" r="20" fill="url(#gradient)" stroke="#fff" stroke-width="3"/>
  <circle cx="140" cy="80" r="20" fill="url(#gradient)" stroke="#fff" stroke-width="3"/>
  <circle cx="100" cy="140" r="20" fill="url(#gradient)" stroke="#fff" stroke-width="3"/>

  <!-- Transition arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e8555" />
    </marker>
  </defs>

  <!-- Arrow from left to right -->
  <line x1="80" y1="80" x2="120" y2="80" stroke="#2e8555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow from right to bottom -->
  <line x1="130" y1="95" x2="110" y2="125" stroke="#2e8555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow from bottom to left -->
  <line x1="85" y1="130" x2="70" y2="95" stroke="#2e8555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- State labels -->
  <text x="60" y="85" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">A</text>
  <text x="140" y="85" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">B</text>
  <text x="100" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">C</text>

  <!-- Title -->
  <text x="100" y="30" text-anchor="middle" fill="#2e8555" font-family="Arial, sans-serif" font-size="16" font-weight="bold">State Machine</text>
</svg>
